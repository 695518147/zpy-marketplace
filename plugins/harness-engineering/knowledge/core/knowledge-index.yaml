## 三层覆盖

项目 `.harness/` > `~/.claude/harness.local/` > `~/.claude/plugins/harness-engineering/`

---

## 沉淀流程

```
修复错误
    ↓
AI 智能判断是否值得沉淀
    ├─ 隐含约束/架构盲区/流程违规/重复犯错/修复成本>5min → 询问用户确认沉淀
    └─ 拼写语法小错/工具失误/已有规则未遵守 → 静默跳过
    ↓
用户确认沉淀
    ↓
查本文件判重
    ├─ 同类存在 → 合并更新
    └─ 新类 → 新建条目
    ↓
写入文件 + 更新索引
```