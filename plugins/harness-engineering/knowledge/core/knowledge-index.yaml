# Knowledge Index — 错误沉淀知识索引

本文件是 Harness Engineering 的错误沉淀知识索引，供所有 Skill 查询错误沉淀。

## 索引结构

每个条目包含：
- `id`: 唯一标识（ks-XXX 格式）
- `title`: 简短标题
- `type`: 类型（process/rule/anti-pattern/knowledge）
- `severity`: 严重度（high/medium/low）
- `tags`: 标签列表（用于判重）
- `location`: 沉淀位置
- `summary`: 摘要描述

## 判重规则

新条目与已有条目 `tags` 重叠 > 50% 视为同类，合并而非新建。

